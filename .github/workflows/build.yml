
name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ARM toolchain
        uses: numworks/setup-arm-toolchain@latest

      
      
      - name: Debug EADK flags
        shell: bash
        run: |
          node --version
          npm --version
          npm view nwlink@0.0.19 version
          set +e
          npx --yes -- nwlink@0.0.19 eadk-cflags \
            > /tmp/nwlink-out.txt 2> /tmp/nwlink-err.txt
          result=$?
          echo "Exit code: $result"
          echo "=== STDOUT ==="
          cat /tmp/nwlink-out.txt
          echo "=== STDERR (fin du journal) ==="
          tail -c 4000 /tmp/nwlink-err.txt
          exit "$result"


      - name: Build app
        run: make clean build


      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: mini-bs-numworks-nwa
          path: target/mini-bs.nwa
