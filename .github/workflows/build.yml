
name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ARM toolchain
        uses: numworks/setup-arm-toolchain@latest

      
      - name: Debug EADK flags
        run: |
          echo "=== nwlink version ==="
          npx --yes -- nwlink@0.0.16 --version || true
          echo "=== EADK flags ==="
          npx --yes -- nwlink@0.0.16 eadk-cflags
          echo "=== EADK flags exit code ==="
          echo $?

      - name: Build app
        run: make clean build


      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: mini-bs-numworks-nwa
          path: target/mini-bs.nwa
