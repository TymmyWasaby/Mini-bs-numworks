name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (nwlink incompatible Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build app
        run: make clean build

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: mini-bs-numworks-nwa
          path: target/mini-bs.nwa
