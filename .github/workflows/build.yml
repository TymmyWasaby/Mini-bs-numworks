
name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ARM toolchain
        uses: numworks/setup-arm-toolchain@latest

      
      
      - name: Debug EADK flags
        run: |
          node --version
          npm --version
          npm view nwlink@0.0.19 version
          npx --yes nwlink@0.0.19 eadk-cflags
          echo "=== STDOUT ==="
          cat /tmp/eadk-flags.txt
          echo "=== STDERR ==="
          head -c 5000 /tmp/nwlink-error.txt
          echo


      - name: Build app
        run: make clean build


      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: mini-bs-numworks-nwa
          path: target/mini-bs.nwa
