name: Build NumWorks app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (nwlink incompatible Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup ARM toolchain + ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi imagemagick

      - name: Generate valid 55x56 icon
        run: convert -size 55x56 xc:'#3B2A63' -fill '#FFC928' -draw "circle 27,27 27,8" -fill '#8A4BE0' -draw "circle 27,28 27,14" -fill white -draw "circle 21,24 21,22" -fill white -draw "circle 33,24 33,22" -fill black -draw "circle 21,25 21,24" -fill black -draw "circle 33,25 33,24" -fill black -draw "rectangle 23,32 31,33" src/icon.png && identify src/icon.png

      - name: Build app
        run: make clean build

      - name: Upload NWA
        uses: actions/upload-artifact@v4
        with:
          name: mini-bs-numworks-nwa
          path: target/mini-bs.nwa
